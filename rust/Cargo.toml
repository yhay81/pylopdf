[package]
publish = false
name = "pylopdf-core"
description = "Rust core for pylopdf PDF editing, rendering, extraction, and generation"
license = "MIT"
homepage = "https://github.com/yhay81/pylopdf"
repository = "https://github.com/yhay81/pylopdf.git"
readme = "../README.md"
version = "0.10.0"
edition = "2024"
authors = ["Yusuke Hayashi <yusuke8h@gmail.com>"]

[lib]
name = "pylopdf"
crate-type = ["cdylib"]

[features]
# Native wheels expose the complete API. Pyodide builds disable only the
# krilla-backed embedded-font generator because its current Rust requirement
# is newer than the Rust/Emscripten pair in Pyodide 0.28.3.
default = ["generation"]
generation = ["dep:harfrust", "dep:krilla", "dep:read-fonts"]

[dependencies]
# Exclude time/jiff: current time is incompatible with lopdf 0.44; chrono is sufficient.
# embed-fonts bundles Standard 14 substitutes so unresolved fonts still render.
hayro = { version = "0.7", features = ["embed-fonts"] }
hayro-svg = "0.7"
# Generate compact, subset-embedded OpenType text as importable PDF forms.
# Keep raster and PDF-import features disabled: lopdf owns both responsibilities.
krilla = { version = "=0.8.2", default-features = false, optional = true }
# Shape Unicode text without krilla's deprecated rustybuzz/ttf-parser path.
harfrust = { version = "0.12.0", optional = true }
# Read vertical metrics from the same font model used by HarfRust.
read-fonts = { version = "0.41.0", optional = true }
# Measure the PDF Core 14 fonts from Adobe's canonical AFM data.
pdf-base14-metrics = "0.0.1"
# Apply UAX #14 wrapping to Latin, CJK, and mixed-script text.
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12"
# generate-import-lib enables Windows builds in Python-free containers/cross environments.
pyo3 = { version = "0.29.0", features = ["abi3-py310", "generate-import-lib"] }
# Used for coordinate transforms in the hayro text-extraction Device; align versions.
kurbo = "0.13"
# Encode non-JPEG extracted images as PNG; match the version already used by hayro.
png = "0.18"
# Expand the prefix of [FlateDecode, DCTDecode] before JPEG passthrough.
# Use the zlib-rs backend. Enabling any_zlib disables miniz_oxide's rust_backend,
# so the whole tree uses zlib-rs even alongside lopdf's default features.
flate2 = { version = "1", features = ["zlib-rs"] }
# Run optional PP-OCR models without a C++ runtime. Preconverted RTen model data
# ships independently through pylopdf[ocr], keeping the ONNX parser out of the
# core wheel.
rten = { version = "0.24.0", default-features = false, features = ["rten_format"] }
rten-tensor = "0.24.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Expose the already-linked rayon runtime for supported batch rendering.
rayon = "1"
lopdf = { version = "0.44.0", default-features = false, features = ["chrono", "rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Python Workers do not expose pthreads, so lopdf must parse serially.
lopdf = { version = "0.44.0", default-features = false, features = ["chrono"] }

[build-dependencies]
pyo3-build-config = "0.29.0"

[patch.crates-io]
# Pyodide 0.28.3 pins Rust 1.86. Keep lopdf current while replacing three
# slice-cursor calls stabilized after that compiler; see vendor/weezl/PATCH.md.
weezl = { path = "vendor/weezl" }
