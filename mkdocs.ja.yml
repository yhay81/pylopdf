site_name: pylopdf
site_url: https://pylopdf.haya.works/ja/
site_description: PythonでPDFを編集・描画・抽出・生成。Rustコアを持つpymupdf流のAPIで、MITライセンス、必須の依存なし。
site_author: Yusuke Hayashi
copyright: Copyright &copy; 2026 Yusuke Hayashi · MIT License
repo_url: https://github.com/yhay81/pylopdf
repo_name: yhay81/pylopdf
edit_uri: edit/main/docs/ja/
docs_dir: docs/ja
site_dir: site/ja

theme:
  name: material
  variant: modern
  language: ja
  custom_dir: docs/overrides
  font: false
  icon:
    logo: material/file-document-edit-outline
    repo: fontawesome/brands/github
    alternate: material/translate
  features:
    - announce.dismiss
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークモードへ切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: ライトモードへ切り替え

nav:
  - ホーム: index.md
  - ガイド:
      - はじめる: getting-started.md
      - pymupdfからの移行: migration.md
      - オフラインOCR: ocr.md
      - 並行実行: concurrency.md
      - WebAssembly: wasm.md
      - エコシステム連携: ecosystem.md
  - APIリファレンス: api.md
  - プロジェクト:
      - セキュリティ: security.md
      - API安定性: stability.md
      - ベンチマーク: benchmarks.md
      - コントリビュートとサポート: contributing.md
      - 変更履歴: https://github.com/yhay81/pylopdf/blob/main/CHANGELOG.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  current_language: ja
  announcement: "pylopdf 0.16.0 · APIの作り直し・ページの内容・キャンバスによる描画"
  announcement_url: "https://github.com/yhay81/pylopdf/releases/tag/v0.16.0"
  social_image: "https://pylopdf.haya.works/assets/images/pylopdf-social-card.png"
  alternate:
    - name: English
      link: https://pylopdf.haya.works/
      lang: en
    - name: 日本語
      link: https://pylopdf.haya.works/ja/
      lang: ja
    - name: 简体中文
      link: https://pylopdf.haya.works/zh-cn/
      lang: zh-Hans
    - name: 한국어
      link: https://pylopdf.haya.works/ko/
      lang: ko
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yhay81/pylopdf
      name: GitHubのpylopdf
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pylopdf/
      name: PyPIのpylopdf
