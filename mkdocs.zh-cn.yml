site_name: pylopdf
site_url: https://pylopdf.haya.works/zh-cn/
site_description: pylopdf 已归档，请迁移至后继项目 pyropdf。
site_author: Yusuke Hayashi
copyright: Copyright &copy; 2026 Yusuke Hayashi · MIT License
repo_url: https://github.com/yhay81/pylopdf
repo_name: yhay81/pylopdf
docs_dir: docs/zh-cn
site_dir: site/zh-cn

theme:
  name: material
  variant: modern
  language: zh
  custom_dir: docs/overrides
  font: false
  icon:
    logo: material/file-document-edit-outline
    repo: fontawesome/brands/github
    alternate: material/translate
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top
    - content.code.annotate
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

nav:
  - 首页: index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins: []

extra:
  current_language: zh-Hans
  announcement: "pylopdf 已在 0.16.1 归档 · 请迁移至 pyropdf"
  announcement_url: "https://pyropdf.haya.works/"
  social_image: "https://pylopdf.haya.works/assets/images/pylopdf-social-card.png"
  alternate:
    - name: English
      link: https://pylopdf.haya.works/
      lang: en
    - name: 日本語
      link: https://pylopdf.haya.works/ja/
      lang: ja
    - name: 简体中文
      link: https://pylopdf.haya.works/zh-cn/
      lang: zh-Hans
    - name: 한국어
      link: https://pylopdf.haya.works/ko/
      lang: ko
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yhay81/pyropdf
      name: GitHub上的pyropdf
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyropdf/
      name: PyPI上的pyropdf
