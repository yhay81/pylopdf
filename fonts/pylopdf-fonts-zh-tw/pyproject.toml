[project]
name = "pylopdf-fonts-zh-tw"
version = "0.1.0"
description = "Traditional Chinese fallback and generation fonts for pylopdf — Noto Sans TC / Noto Serif TC"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ "name" = "Yusuke Hayashi", "email" = "yusuke8h@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: SIL Open Font License 1.1 (OFL-1.1)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Fonts",
]
dependencies = []

[project.urls]
Repository = "https://github.com/yhay81/pylopdf"
Font-Source = "https://github.com/notofonts/noto-cjk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylopdf_fonts_zh_tw"]
