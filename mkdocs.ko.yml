site_name: pylopdf
site_url: https://pylopdf.haya.works/ko/
site_description: pylopdf는 아카이브되었습니다. 후속 프로젝트인 pyropdf로 이전해 주세요.
site_author: Yusuke Hayashi
copyright: Copyright &copy; 2026 Yusuke Hayashi · MIT License
repo_url: https://github.com/yhay81/pylopdf
repo_name: yhay81/pylopdf
docs_dir: docs/ko
site_dir: site/ko

theme:
  name: material
  variant: modern
  language: ko
  custom_dir: docs/overrides
  font: false
  icon:
    logo: material/file-document-edit-outline
    repo: fontawesome/brands/github
    alternate: material/translate
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top
    - content.code.annotate
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환

nav:
  - 홈: index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins: []

extra:
  current_language: ko
  announcement: "pylopdf는 0.16.1을 끝으로 아카이브되었습니다 · pyropdf로 이전해 주세요"
  announcement_url: "https://pyropdf.haya.works/"
  social_image: "https://pylopdf.haya.works/assets/images/pylopdf-social-card.png"
  alternate:
    - name: English
      link: https://pylopdf.haya.works/
      lang: en
    - name: 日本語
      link: https://pylopdf.haya.works/ja/
      lang: ja
    - name: 简体中文
      link: https://pylopdf.haya.works/zh-cn/
      lang: zh-Hans
    - name: 한국어
      link: https://pylopdf.haya.works/ko/
      lang: ko
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yhay81/pyropdf
      name: GitHub의 pyropdf
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyropdf/
      name: PyPI의 pyropdf
