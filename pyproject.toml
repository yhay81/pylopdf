[project]
name = "pylopdf"
version = "0.14.0"
description = "PDF editing, rendering, extraction, and generation for Python, powered by Rust. MIT, no mandatory Python dependencies, lightweight wheels."
authors = [{ "name" = "Yusuke Hayashi", "email" = "yusuke8h@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "LICENSES/*"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: WebAssembly :: Emscripten",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/yhay81/pylopdf"
Documentation = "https://pylopdf.haya.works/"
Changelog = "https://github.com/yhay81/pylopdf/blob/main/CHANGELOG.md"
Issues = "https://github.com/yhay81/pylopdf/issues"
Source = "https://github.com/yhay81/pylopdf"

[project.optional-dependencies]
# Script and locale-specific fonts for automatic generation.
ar = ["pylopdf-fonts-ar>=0.1.1,<0.2"]
he = ["pylopdf-fonts-he>=0.1.1,<0.2"]
hi = ["pylopdf-fonts-hi>=0.1.1,<0.2"]
jp = ["pylopdf-fonts-jp>=0.1.1,<0.2"]
ko = ["pylopdf-fonts-ko>=0.1.1,<0.2"]
th = ["pylopdf-fonts-th>=0.1.1,<0.2"]
zh-cn = ["pylopdf-fonts-zh-cn>=0.1.1,<0.2"]
zh-tw = ["pylopdf-fonts-zh-tw>=0.1.1,<0.2"]
# PP-OCRv6 small detector, recognizer, and multilingual dictionary.
ocr = ["pylopdf-ocr-models>=0.1.0,<0.2"]

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "pylopdf.pylopdf_core"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "pre-commit>=4.6.1",
    "pytest>=8.3",
    "ruff>=0.17.1",
    # ty is pre-1.0 and its diagnostics change between releases; uv.lock pins
    # the version that CI and the pre-commit hook run.
    "ty>=0.0.89",
    "typing-extensions>=4.6",
]
# Integration tests for the ecosystem recipes in the README; skipped when absent.
interop = [
    "typst>=0.15",
    "pyhanko>=0.36.1",
]
# Comparison libraries for reproducible benchmarks; manual only, not installed in CI.
bench = [
    "pymupdf>=1.26",
    "pypdf>=5",
    "pdfplumber>=0.11",
]
# Zensical documentation site. CI uses --only-group docs --no-install-project.
docs = [
    "zensical>=0.0.51,<0.1",
]
# Coverage-guided public-API fuzzing; Linux/macOS only.
fuzz = [
    # Atheris 3.1 ships only x86-64 Linux wheels and no source distribution;
    # the 3.0.0 source distribution still builds on macOS and Linux ARM64.
    "atheris==3.0.0",
]

[tool.uv]
# Cache keys that make uv rebuild the extension after Rust source or local
# release-profile overrides change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/build.rs" },
    { file = "rust/src/*.rs" },
    { env = "CARGO_PROFILE_RELEASE_LTO" },
    { env = "CARGO_PROFILE_RELEASE_CODEGEN_UNITS" },
]

[tool.uv.workspace]
members = [
    "fonts/pylopdf-fonts-ar",
    "fonts/pylopdf-fonts-he",
    "fonts/pylopdf-fonts-hi",
    "fonts/pylopdf-fonts-jp",
    "fonts/pylopdf-fonts-ko",
    "fonts/pylopdf-fonts-th",
    "fonts/pylopdf-fonts-zh-cn",
    "fonts/pylopdf-fonts-zh-tw",
    "models/pylopdf-ocr-models",
]

[tool.uv.sources]
# Resolve data-only extras to their workspace packages during local development.
pylopdf-fonts-ar = { workspace = true }
pylopdf-fonts-he = { workspace = true }
pylopdf-fonts-hi = { workspace = true }
pylopdf-fonts-jp = { workspace = true }
pylopdf-fonts-ko = { workspace = true }
pylopdf-fonts-th = { workspace = true }
pylopdf-fonts-zh-cn = { workspace = true }
pylopdf-fonts-zh-tw = { workspace = true }
pylopdf-ocr-models = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
# Check the package and its tests. ty reads the Python 3.10 floor from
# project.requires-python.
include = ["src", "tests"]

[tool.ty.analysis]
# Modules that a regular development environment may not install: pypdf is
# used only by a manually run fixture generator, the locale font and OCR model
# packages come from extras, and typst, pyHanko, and cryptography (transitive
# through pyHanko) come from the interop group.
allowed-unresolved-imports = [
    "pypdf.**",
    "pylopdf_fonts_*",
    "pylopdf_ocr_models",
    "typst",
    "pyhanko.**",
    "cryptography.**",
]

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py310"
# python/ and lambda_test/ are unrelated colocated work. Keep Markdown examples
# hand-aligned and validate them through the documentation build.
extend-exclude = ["python", "lambda_test", "*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The repository-level license covers source files without repeated headers.
    "CPY001",
    "D100",
    "D104",
    # Rules that conflict with ruff format.
    "COM812",
    "ISC001",
    "D203",
    "D213",
    # CJK fixture data intentionally contains ambiguous Unicode characters.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Document, Page, and the classes that they create cooperate and intentionally
# share internal state across these modules.
"src/pylopdf/{_document,_fonts,_page,_shape,_tables}.py" = ["SLF001"]
# S106: fixed test-fixture passwords are not secrets.
# FBT003: set_form_field intentionally accepts bool checkbox values, like pymupdf.
"tests/**" = ["INP001", "S101", "D103", "PLR2004", "TC003", "S106", "FBT003"]
# Manually run generator that prints progress.
"tests/assets/encrypted/generate.py" = ["T201"]
# Integration libraries must be imported after importorskip.
"tests/test_interop.py" = ["E402"]
# Manual benchmark script: prints progress/results, tolerates competitor failures,
# and uses sequential report generation with a loop-local try block.
"bench/**" = ["INP001", "T201", "BLE001", "PLR0915", "PERF203"]
