# Temporary evaluation branch only: compare main with the retained render-cache
# candidate on every release target. Build jobs mirror release.yml; bench jobs
# interleave the resulting wheels on one runner so both builds share runner noise.
name: Render cache evaluation

on:
  push:
    branches: ["claude/render-cache-eval"]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    name: build (${{ matrix.platform.target }}, ${{ matrix.variant.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
        variant:
          - { name: main, ref: 3b4c8abed202bb5ab0fd17c3dd09a0b12ed8efe4 }
          - { name: cache, ref: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.variant.ref }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.99.0"
          maturin-version: "1.14.1"
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Smoke-test installed wheel
        run: python tools/smoke_artifact.py dist --pattern "*.whl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-wheel-${{ matrix.platform.target }}-${{ matrix.variant.name }}
          path: dist
          retention-days: 30

  bench:
    name: bench (${{ matrix.platform.target }})
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      UV_PYTHON_PREFERENCE: only-system
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: eval-wheel-${{ matrix.platform.target }}-*
          path: artifacts
      - name: Record wheel sizes
        shell: bash
        run: |
          for wheel in artifacts/*/*.whl; do
            printf '%s %s\n' "$(wc -c < "${wheel}" | tr -d ' ')" "${wheel}"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Create one environment per build
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          uv export --frozen --only-group bench --no-hashes --no-emit-project -o bench-requirements.txt
          interpreter="$(python -c 'import sys; print(sys.executable)')"
          for variant in main cache; do
            uv venv --python "${interpreter}" "venv-${variant}"
            python_bin="venv-${variant}/bin/python"
            [[ -x "${python_bin}" ]] || python_bin="venv-${variant}/Scripts/python.exe"
            uv pip install --python "${python_bin}" psutil==7.2.2 -r bench-requirements.txt \
              artifacts/eval-wheel-${TARGET}-${variant}/*.whl
          done
      - name: Run interleaved rounds
        shell: bash
        run: BENCH_REPEATS=7 bash .github/render-cache-eval/ab_rounds.sh ab 8 . venv- main cache
      - name: Summarize interleaved rounds
        shell: bash
        run: python .github/render-cache-eval/ab_summary.py ab main cache | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run bench/run.py once per build
        shell: bash
        run: |
          mkdir -p ab/reports
          for variant in main cache; do
            python_bin="venv-${variant}/bin/python"
            [[ -x "${python_bin}" ]] || python_bin="venv-${variant}/Scripts/python.exe"
            BENCH_REPEATS=5 "${python_bin}" -W ignore bench/run.py
            cp bench/results/latest.md "ab/reports/latest-${variant}.md"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-bench-${{ matrix.platform.target }}
          path: ab
          retention-days: 30
