name: Fuzz

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: public API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build fuzz environment
        run: uv sync --group fuzz --python 3.13
      - name: Fuzz public workflows
        id: fuzz
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/pylopdf-fuzz-corpus"
          mkdir -p "${RUNNER_TEMP}/pylopdf-fuzz-artifacts"
          uv run python fuzz/fuzz_api.py \
            -max_total_time=600 \
            -timeout=60 \
            -rss_limit_mb=2048 \
            -max_len=1048576 \
            -artifact_prefix="${RUNNER_TEMP}/pylopdf-fuzz-artifacts/" \
            "${RUNNER_TEMP}/pylopdf-fuzz-corpus" \
            tests/assets/real_world
      - name: Upload failure reproducer
        if: steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pylopdf-fuzz-reproducer
          path: ${{ runner.temp }}/pylopdf-fuzz-artifacts
          if-no-files-found: error
      - name: Fail after preserving reproducer
        if: steps.fuzz.outcome == 'failure'
        run: exit 1
