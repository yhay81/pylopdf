name: Fuzz

on:
  schedule:
    - cron: "32 19 * * 6"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  api:
    name: public API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Build fuzz environment
        run: uv sync --group fuzz --no-editable-package pylopdf --python 3.13
      - name: Fuzz public workflows
        id: fuzz
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/pylopdf-fuzz-corpus"
          mkdir -p "${RUNNER_TEMP}/pylopdf-fuzz-artifacts"
          uv run --no-sync python fuzz/generate_corpus.py \
            --output "${RUNNER_TEMP}/pylopdf-fuzz-corpus"
          uv run --no-sync python fuzz/fuzz_api.py \
            -max_total_time=600 \
            -timeout=60 \
            -rss_limit_mb=2048 \
            -max_len=1048576 \
            -artifact_prefix="${RUNNER_TEMP}/pylopdf-fuzz-artifacts/" \
            "${RUNNER_TEMP}/pylopdf-fuzz-corpus" \
            tests/assets/real_world \
            tests/assets/encrypted
      - name: Upload failure reproducer
        if: steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pylopdf-fuzz-reproducer
          path: ${{ runner.temp }}/pylopdf-fuzz-artifacts
          if-no-files-found: error
      - name: Fail after preserving reproducer
        if: steps.fuzz.outcome == 'failure'
        run: exit 1
