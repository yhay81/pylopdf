# Locale font wheel release CI.
#
# Tags are fonts-{locale}-v{version}. Supported locale/script codes are
# ar, he, hi, jp, ko, th, zh-cn, and zh-tw.
# Each PyPI project needs the same Trusted Publisher configuration:
#   owner: yhay81 / repository: pylopdf / workflow: release-fonts.yml / environment: pypi
name: Release locale fonts

on:
  push:
    tags:
      - "fonts-ar-v*"
      - "fonts-he-v*"
      - "fonts-hi-v*"
      - "fonts-jp-v*"
      - "fonts-ko-v*"
      - "fonts-th-v*"
      - "fonts-zh-cn-v*"
      - "fonts-zh-tw-v*"
  workflow_dispatch:
    inputs:
      locale:
        description: Locale font package to build without publishing
        required: true
        type: choice
        options:
          - ar
          - he
          - hi
          - jp
          - ko
          - th
          - zh-cn
          - zh-tw

permissions: {}

jobs:
  prepare:
    name: Select locale font package
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      locale: ${{ steps.package.outputs.locale }}
      package: ${{ steps.package.outputs.package }}
      path: ${{ steps.package.outputs.path }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: package
        name: Resolve package and verify the release tag
        env:
          DISPATCH_LOCALE: ${{ inputs.locale }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            locale="${REF_NAME#fonts-}"
            locale="${locale%-v*}"
          else
            locale="$DISPATCH_LOCALE"
          fi
          case "$locale" in
            ar|he|hi|jp|ko|th|zh-cn|zh-tw) ;;
            *) echo "unsupported font locale: $locale" >&2; exit 1 ;;
          esac
          package="pylopdf-fonts-${locale}"
          path="fonts/${package}"
          version="$(python -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$path/pyproject.toml")"
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "fonts-${locale}-v${version}" ]]; then
            echo "tag $REF_NAME does not match fonts-${locale}-v${version}" >&2
            exit 1
          fi
          echo "locale=$locale" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and attest ${{ needs.prepare.outputs.package }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Verify bundled font hashes
        run: |
          cd "$PACKAGE_PATH"
          sha256sum --check SHA256SUMS
        env:
          PACKAGE_PATH: ${{ needs.prepare.outputs.path }}
      - name: Build sdist and wheel
        run: uv build --package "$PACKAGE" --out-dir dist
        env:
          PACKAGE: ${{ needs.prepare.outputs.package }}
      - name: Generate SPDX SBOM
        run: |
          python tools/generate_font_sbom.py \
            --dist-dir dist \
            --output release/sbom.spdx.json \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$(git show -s --format=%ct "$GITHUB_SHA")"
      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release/sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fonts-${{ needs.prepare.outputs.locale }}-dist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fonts-${{ needs.prepare.outputs.locale }}-sbom
          path: release/sbom.spdx.json

  publish:
    name: Publish ${{ needs.prepare.outputs.package }}
    if: github.ref_type == 'tag'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fonts-${{ needs.prepare.outputs.locale }}-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  github-release:
    name: Create immutable GitHub release
    if: github.ref_type == 'tag'
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
