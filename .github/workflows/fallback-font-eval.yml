# Temporary evaluation branch only: compare main with the shared fallback-font
# candidate on every release target, with every locale font extra installed as
# `uv sync --all-extras` does. Build jobs mirror release.yml; bench jobs
# interleave the resulting wheels on one runner so both builds share its noise.
name: Fallback font cache evaluation

on:
  push:
    branches: ["claude/fallback-font-cache-eval"]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    name: build (${{ matrix.platform.target }}, ${{ matrix.variant.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
        variant:
          - { name: main, ref: 3b4c8abed202bb5ab0fd17c3dd09a0b12ed8efe4 }
          - { name: shared, ref: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.variant.ref }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.99.0"
          maturin-version: "1.14.1"
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Smoke-test installed wheel
        run: python tools/smoke_artifact.py dist --pattern "*.whl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-wheel-${{ matrix.platform.target }}-${{ matrix.variant.name }}
          path: dist
          retention-days: 30

  fonts:
    name: locale font wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - name: Build every locale font wheel
        run: |
          for package in fonts/pylopdf-fonts-*; do
            uv build --wheel "${package}" -o font-wheels
          done
          ls -l font-wheels
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-font-wheels
          path: font-wheels/*.whl
          retention-days: 30

  bench:
    name: bench (${{ matrix.platform.target }})
    needs: [build, fonts]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      UV_PYTHON_PREFERENCE: only-system
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: eval-wheel-${{ matrix.platform.target }}-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eval-font-wheels
          path: font-wheels
      - name: Create one environment per build
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          interpreter="$(python -c 'import sys; print(sys.executable)')"
          for variant in main shared; do
            uv venv --python "${interpreter}" "venv-${variant}"
            python_bin="venv-${variant}/bin/python"
            [[ -x "${python_bin}" ]] || python_bin="venv-${variant}/Scripts/python.exe"
            uv pip install --python "${python_bin}" psutil==7.2.2 \
              artifacts/eval-wheel-"${TARGET}-${variant}"/*.whl font-wheels/*.whl
          done
          python .github/fallback-font-eval/make_fixtures.py fixtures
      - name: Run interleaved rounds
        shell: bash
        run: |
          AB_REPEATS=9 bash .github/fallback-font-eval/ab_rounds.sh ab 8 \
            tests/assets/real_world fixtures venv- main shared
      - name: Summarize interleaved rounds
        shell: bash
        run: python .github/fallback-font-eval/ab_summary.py ab main shared | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-bench-${{ matrix.platform.target }}
          path: ab
          retention-days: 30
