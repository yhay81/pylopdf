# Temporary evaluation branch only: repeat interleaved profile benchmarks with
# the wheels built by run 39039799109, adding a merge-phase breakdown.
name: LTO evaluation

on:
  push:
    branches: ["claude/native-release-lto-eval"]

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      UV_PYTHON_PREFERENCE: only-system
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lto-wheel-${{ matrix.platform.target }}-*
          path: artifacts
          run-id: 39039799109
          github-token: ${{ github.token }}
      - name: Create one environment per profile
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          uv export --frozen --only-group bench --no-hashes --no-emit-project -o bench-requirements.txt
          interpreter="$(python -c 'import sys; print(sys.executable)')"
          for variant in baseline thin fat; do
            uv venv --python "${interpreter}" "venv-${variant}"
            python_bin="venv-${variant}/bin/python"
            [[ -x "${python_bin}" ]] || python_bin="venv-${variant}/Scripts/python.exe"
            uv pip install --python "${python_bin}" -r bench-requirements.txt \
              artifacts/lto-wheel-${TARGET}-${variant}/dist/*.whl
          done
      - name: Run interleaved pylopdf rounds
        shell: bash
        run: BENCH_REPEATS=7 bash .github/lto-eval/ab_rounds.sh ab 8 . venv- baseline thin fat
      - name: Summarize interleaved rounds
        shell: bash
        run: python .github/lto-eval/ab_summary.py ab baseline thin fat | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lto-bench2-${{ matrix.platform.target }}
          path: ab
          retention-days: 30
