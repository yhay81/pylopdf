# OCR model wheel release CI: publish pylopdf-ocr-models on an ocr-models-v* tag.
#
# Publishing requires a Trusted Publisher configured on PyPI:
#   PyPI → project pylopdf-ocr-models → Publishing → GitHub
#   owner: yhay81 / repository: pylopdf / workflow: release-ocr-models.yml / environment: pypi
name: Release OCR models

on:
  push:
    tags: ["ocr-models-v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build and attest pylopdf-ocr-models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false
      - name: Set up relocatable build Python
        run: bash tools/setup_ci_python.sh 3.14
      - name: Verify package versions and release tag
        id: package
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("models/pylopdf-ocr-models/pyproject.toml", "rb"))["project"]["version"])')"
          module_version="$(PYTHONPATH=models/pylopdf-ocr-models/src python -c 'import pylopdf_ocr_models; print(pylopdf_ocr_models.__version__)')"
          test "${package_version}" = "${module_version}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF_TYPE}" = "tag" ]]; then
            test "ocr-models-v${package_version}" = "${GITHUB_REF_NAME}"
          fi
      - name: Verify bundled model artifacts
        working-directory: models/pylopdf-ocr-models/src/pylopdf_ocr_models
        run: sha256sum --check SHA256SUMS
      - name: Build sdist and wheel
        run: uv build --package pylopdf-ocr-models --out-dir dist
      - name: Verify reproducible distributions
        run: |
          uv build --package pylopdf-ocr-models --out-dir dist-repro
          for artifact in dist/*.whl dist/*.tar.gz; do
            cmp "${artifact}" "dist-repro/$(basename "${artifact}")"
          done
      - name: Validate distribution metadata
        run: uvx --from twine==6.2.0 twine check dist/*
      - name: Smoke-test installed wheel and sdist
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            case "${artifact}" in
              *.whl) kind="wheel" ;;
              *) kind="sdist" ;;
            esac
            environment=".venv-smoke-${kind}"
            uv venv --no-project "${environment}"
            uv pip install --python "${environment}/bin/python" "${artifact}"
            "${environment}/bin/python" tools/smoke_ocr_models_artifact.py \
              --version "${{ steps.package.outputs.version }}"
          done
      - run: mkdir -p release
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release/sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-models-dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-models-sbom
          path: release/sbom.spdx.json

  publish:
    name: Publish pylopdf-ocr-models
    if: startsWith(github.ref, 'refs/tags/ocr-models-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-models-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create immutable GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
