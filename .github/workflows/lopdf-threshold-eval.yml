# Temporary evaluation branch only: measure the second calling-thread limit
# of the pending lopdf draft (fewer than 48 entries under 32 KiB) on its worst
# case, documents of many small dictionaries, which cost more to parse per
# entry than pages. Run 39175297480 measured the builds on the general
# inputs. Interleaved on one runner so every variant shares its noise.
name: lopdf threshold evaluation

on:
  push:
    branches: ["claude/lopdf-threshold-eval"]

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      EVAL: .github/lopdf-threshold-eval
      BUILDS: pr-rayon both-rayon tuned-rayon envnew-rayon
      # both and tuned: the draft as it is and with the second limit, on top
      # of the parser change. par and seq force the evaluation build onto the
      # pool and onto the calling thread.
      LOAD_VARIANTS: >-
        both=both-rayon tuned=tuned-rayon
        par=envnew-rayon,LOPDF_MIN_PARALLEL=0,LOPDF_MIN_PARALLEL_MEMBERS=0
        seq=envnew-rayon,LOPDF_MIN_PARALLEL=1000000000,LOPDF_MIN_PARALLEL_MEMBERS=1000000000,LOPDF_MIN_PARALLEL_BYTES=1000000000000
    steps:
      - name: Keep checked-out line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Describe the runner
        run: |
          python -c "import os, platform; print(platform.platform(), platform.machine(), os.cpu_count(), 'cpus')"
          rustc --version
      - name: Build the loadbench variants
        run: bash "${EVAL}/build.sh" work
      - name: Install pylopdf for the real-world subsets
        run: |
          python -m venv venv-pylopdf
          python_bin="venv-pylopdf/bin/python"
          [[ -x "${python_bin}" ]] || python_bin="venv-pylopdf/Scripts/python.exe"
          "${python_bin}" -m pip install --quiet pylopdf==0.14.0
          echo "PYLOPDF_PYTHON=$(pwd)/${python_bin}" >>"$GITHUB_ENV"
      - name: Write the inputs
        run: bash "${EVAL}/inputs-dicts.sh" work . "${PYLOPDF_PYTHON}"
      - name: Check that every variant loads the same documents
        working-directory: work
        run: |
          mkdir -p out
          bin/pr-rayon info dicts/*.pdf >out/inputs.jsonl
          {
            echo "## Inputs (${{ matrix.platform.target }})"
            python "../${EVAL}/check.py" bin "${LOAD_VARIANTS}" dicts/*.pdf
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run interleaved load rounds
        working-directory: work
        run: python "../${EVAL}/ab.py" out/load 8 bin "${LOAD_VARIANTS}" "warm:30 cold:15:10 first:5" dicts/*.pdf
      - name: Summarize
        if: always()
        working-directory: work
        run: |
          {
            echo "## Loads (${{ matrix.platform.target }}), Δ against both"
            python "../${EVAL}/summary.py" out/load both tuned par seq
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-${{ matrix.platform.target }}
          path: work/out
          retention-days: 30
