# Temporary evaluation branch only: compare the pending lopdf calling-thread
# draft with a second limit (also fewer than 48 entries when the input is
# under 32 KiB) against the draft as it is, both on top of the pending parser
# change, and both without it. Runs 39172528996 and 39173055129 swept the
# thresholds with an evaluation-only override; this run measures the builds
# themselves, interleaved on one runner so every build shares its noise.
name: lopdf threshold evaluation

on:
  push:
    branches: ["claude/lopdf-threshold-eval"]

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      EVAL: .github/lopdf-threshold-eval
      BUILDS: pr-rayon both-rayon tuned-rayon small-rayon oldtuned-rayon
      # pr: the parser change alone. both and tuned: the draft as it is and
      # with the second limit, on top of the parser change. small and
      # oldtuned: the same two without the parser change.
      LOAD_VARIANTS: >-
        pr=pr-rayon both=both-rayon tuned=tuned-rayon
        small=small-rayon oldtuned=oldtuned-rayon
    steps:
      - name: Keep checked-out line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.99.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Describe the runner
        run: |
          python -c "import os, platform; print(platform.platform(), platform.machine(), os.cpu_count(), 'cpus')"
          rustc --version
      - name: Build the loadbench variants
        run: bash "${EVAL}/build.sh" work
      - name: Install pylopdf for the real-world subsets
        run: |
          python -m venv venv-pylopdf
          python_bin="venv-pylopdf/bin/python"
          [[ -x "${python_bin}" ]] || python_bin="venv-pylopdf/Scripts/python.exe"
          "${python_bin}" -m pip install --quiet pylopdf==0.14.0
          echo "PYLOPDF_PYTHON=$(pwd)/${python_bin}" >>"$GITHUB_ENV"
      - name: Write the inputs
        run: bash "${EVAL}/inputs.sh" work . "${PYLOPDF_PYTHON}"
      - name: Check that every variant loads the same documents
        working-directory: work
        run: |
          mkdir -p out
          bin/pr-rayon info pdfs/*.pdf objstm/*.pdf >out/inputs.jsonl
          {
            echo "## Inputs (${{ matrix.platform.target }})"
            python "../${EVAL}/check.py" bin "${LOAD_VARIANTS}" pdfs/*.pdf objstm/*.pdf
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run interleaved load rounds
        working-directory: work
        run: python "../${EVAL}/ab.py" out/load 8 bin "${LOAD_VARIANTS}" "warm:30 cold:15:10 first:5" pdfs/*.pdf
      - name: Summarize
        if: always()
        working-directory: work
        run: |
          {
            echo "## Loads (${{ matrix.platform.target }}), Δ against pr"
            python "../${EVAL}/summary.py" out/load pr both tuned small oldtuned
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-${{ matrix.platform.target }}
          path: work/out
          retention-days: 30
