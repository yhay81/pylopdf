# Temporary evaluation branch only: compare generated-PDF imports and document
# loads across builds on every release target. `seq` parses generated PDFs
# on the calling thread; `nolr` drops lopdf's rayon feature and bounds what
# that can save. Build jobs
# mirror release.yml; bench jobs interleave the resulting wheels on one runner
# so every build shares its noise.
name: Sequential generated import evaluation

on:
  push:
    branches: ["claude/sequential-import-eval"]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    name: build (${{ matrix.platform.target }}, ${{ matrix.variant.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
        variant:
          - { name: base, ref: 38bb24d1f4b5201a73b0e4de743672161eed1576 }
          - { name: seq, ref: fe43c7f8fccede9e481adde63bdee153631c0d05 }
          - { name: nolr, ref: 86fc8e84a43d566a14ad4f3c817fd770d5bdbc77 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.variant.ref }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: "1.99.0"
          maturin-version: "1.14.1"
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Smoke-test installed wheel
        run: python tools/smoke_artifact.py dist --pattern "*.whl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-wheel-${{ matrix.platform.target }}-${{ matrix.variant.name }}
          path: dist
          retention-days: 30

  fonts:
    name: Japanese font wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - name: Build the Japanese font wheel
        run: |
          uv build --wheel fonts/pylopdf-fonts-jp -o font-wheels
          ls -l font-wheels
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-font-wheels
          path: font-wheels/*.whl
          retention-days: 30

  bench:
    name: bench (${{ matrix.platform.target }})
    needs: [build, fonts]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      UV_PYTHON_PREFERENCE: only-system
      PYTHONUTF8: "1"
      VARIANTS: base seq nolr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: eval-wheel-${{ matrix.platform.target }}-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eval-font-wheels
          path: font-wheels
      - name: Create one environment per build
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          interpreter="$(python -c 'import sys; print(sys.executable)')"
          for variant in ${VARIANTS}; do
            uv venv --python "${interpreter}" "venv-${variant}"
            python_bin="venv-${variant}/bin/python"
            [[ -x "${python_bin}" ]] || python_bin="venv-${variant}/Scripts/python.exe"
            uv pip install --python "${python_bin}" \
              artifacts/eval-wheel-"${TARGET}-${variant}"/*.whl font-wheels/*.whl
          done
      - name: Write the large-document controls
        shell: bash
        run: |
          python_bin="venv-base/bin/python"
          [[ -x "${python_bin}" ]] || python_bin="venv-base/Scripts/python.exe"
          mkdir -p large
          "${python_bin}" .github/sequential-import-eval/make_large.py \
            tests/assets/real_world/usrguide.pdf 20 large/large-streams.pdf
          "${python_bin}" .github/sequential-import-eval/make_large.py \
            tests/assets/real_world/f1040.pdf 10 large/large-objects.pdf
      - name: Run interleaved timing rounds
        shell: bash
        run: |
          # shellcheck disable=SC2086
          bash .github/sequential-import-eval/import_rounds.sh ab 8 15 venv- \
            tests/assets/real_world large ${VARIANTS}
      - name: Summarize timing rounds
        shell: bash
        run: |
          # shellcheck disable=SC2086
          python .github/sequential-import-eval/import_summary.py ab ${VARIANTS} \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-bench-${{ matrix.platform.target }}
          path: ab
          retention-days: 30
