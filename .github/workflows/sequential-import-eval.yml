# Temporary evaluation branch only: compare generated-PDF imports and document
# loads across builds on every release target. `seq` parses generated PDFs
# on the calling thread; `nolr` drops lopdf's rayon feature and bounds what
# that can save. Build jobs
# mirror release.yml; bench jobs interleave the resulting wheels on one runner
# so every build shares its noise. This run reuses the wheels that run
# 39111078639 built and adds load-only processes that generate nothing.
name: Sequential generated import evaluation

on:
  push:
    branches: ["claude/sequential-import-eval"]

permissions:
  actions: read
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_BUILD_JOBS: 2

jobs:
  bench:
    name: bench (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      UV_PYTHON_PREFERENCE: only-system
      PYTHONUTF8: "1"
      VARIANTS: base seq nolr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: eval-wheel-${{ matrix.platform.target }}-*
          path: artifacts
          run-id: 39111078639
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eval-font-wheels
          path: font-wheels
          run-id: 39111078639
          github-token: ${{ github.token }}
      - name: Create one environment per build
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          interpreter="$(python -c 'import sys; print(sys.executable)')"
          for variant in ${VARIANTS}; do
            uv venv --python "${interpreter}" "venv-${variant}"
            python_bin="venv-${variant}/bin/python"
            [[ -x "${python_bin}" ]] || python_bin="venv-${variant}/Scripts/python.exe"
            uv pip install --python "${python_bin}" \
              artifacts/eval-wheel-"${TARGET}-${variant}"/*.whl font-wheels/*.whl
          done
      - name: Write the large-document controls
        shell: bash
        run: |
          python_bin="venv-base/bin/python"
          [[ -x "${python_bin}" ]] || python_bin="venv-base/Scripts/python.exe"
          mkdir -p large
          "${python_bin}" .github/sequential-import-eval/make_large.py \
            tests/assets/real_world/usrguide.pdf 20 large/large-streams.pdf
          "${python_bin}" .github/sequential-import-eval/make_large.py \
            tests/assets/real_world/f1040.pdf 10 large/large-objects.pdf
      - name: Run interleaved timing rounds
        shell: bash
        run: |
          # shellcheck disable=SC2086
          bash .github/sequential-import-eval/import_rounds.sh ab 8 15 venv- \
            tests/assets/real_world large all ${VARIANTS}
      - name: Summarize timing rounds
        shell: bash
        run: |
          # shellcheck disable=SC2086
          python .github/sequential-import-eval/import_summary.py ab ${VARIANTS} \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run interleaved load-only rounds
        shell: bash
        run: |
          # shellcheck disable=SC2086
          bash .github/sequential-import-eval/import_rounds.sh ab/opens 8 15 venv- \
            tests/assets/real_world large opens ${VARIANTS}
      - name: Summarize load-only rounds
        shell: bash
        run: |
          # shellcheck disable=SC2086
          python .github/sequential-import-eval/import_summary.py ab/opens ${VARIANTS} \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-bench-${{ matrix.platform.target }}
          path: ab
          retention-days: 30
