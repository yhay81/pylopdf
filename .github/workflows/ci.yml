# Test CI: run linting, type checking, and tests on three operating systems
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Audit the Rust dependency tree against the RustSec advisory database.
  audit:
    name: audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@724a716c48615d544d33401a24b782e907dc5881 # cargo-audit
      - name: Rust dependency audit
        run: cargo audit --file rust/Cargo.lock

  # Validate the abi3-py310 floor with the oldest supported Python version.
  test-py310:
    name: test (Python 3.10 lower bound)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build and install (Python 3.10)
        run: uv sync --all-extras --group interop --python 3.10
      - name: Test
        run: uv run pytest
      - name: Record native Pyodide compatibility baseline
        run: |
          uv run python tools/pyodide_compat.py \
            --root . \
            --output native-compat/results.json
          uv run python tools/pyodide_compat.py \
            --root . \
            --benchmark-only \
            --benchmark-output native-compat/limits-benchmark.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-pyodide-compat-${{ github.sha }}
          path: native-compat/*.json
          retention-days: 7

  # Test the version-specific ABI without silently falling back to the GIL.
  test-free-threaded:
    name: test (Python 3.14t free-threaded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build and install (Python 3.14t)
        # Keep this lane focused on pylopdf: optional interop extensions may not
        # publish cp314t wheels on the same schedule.
        run: uv sync --all-extras --python 3.14t
      - name: Verify free-threaded import
        run: >-
          uv run python -c
          "import sys, sysconfig, pylopdf;
          assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1;
          assert not sys._is_gil_enabled()"
      - name: Test
        run: uv run pytest

  test-pyemscripten:
    name: test (Pyodide 0.28.3)
    needs: test-py310
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON_DOWNLOADS: automatic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Download native compatibility baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-pyodide-compat-${{ github.sha }}
          path: native-compat
      - name: Restore pinned Pyodide build environment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .tmp/pyodide-0.28.3
          key: >-
            pyodide-0.28.3-${{ runner.os }}-${{
            hashFiles('tools/build_pyodide.sh',
            'tools/pyodide-build-requirements.txt',
            'rust/Cargo.lock') }}
          restore-keys: |
            pyodide-0.28.3-${{ runner.os }}-
      - name: Build and smoke-test PyEmscripten wheel
        run: bash tools/build_pyodide.sh
        env:
          PYLOPDF_PYODIDE_NATIVE_RESULTS: native-compat/results.json
          PYLOPDF_PYODIDE_BENCHMARK_OUTPUT: pyodide-compat/limits-benchmark.json
      - name: Dry-run Cloudflare Workers bundle
        run: python tools/smoke_cloudflare.py --wheel dist/pyodide-0.28.3/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyemscripten-wheel-pyodide-0.28.3
          path: dist/pyodide-0.28.3/*.whl
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyodide-limit-benchmark-${{ github.sha }}
          path: pyodide-compat/limits-benchmark.json
          retention-days: 7

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Rust format check
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Build and install
        # The interop group tests the ecosystem recipes documented in the README.
        run: uv sync --all-extras --group interop
      - name: Validate project metadata
        run: uv run pre-commit run validate-pyproject --all-files
      - name: Python lint
        run: uv run ruff check .
      - name: Repository language
        run: uv run python tools/check_repository_language.py
      - name: Python format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest
