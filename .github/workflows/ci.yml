# Test CI: run linting, type checking, and tests on three operating systems
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  # Audit the Rust dependency tree against the RustSec advisory database.
  audit:
    name: audit (RustSec)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@3e95b5d2ea53a19022dddec602c648200467d281 # cargo-audit
        with:
          tool: cargo-audit
      - name: Install pinned workflow validator
        run: bash tools/install_actionlint.sh
      - name: Rust dependency audit
        run: cargo audit --file rust/Cargo.lock
      - name: Workflow validation
        run: actionlint -shellcheck=''

  # Validate the abi3-py310 floor with the oldest supported Python version.
  test-py310:
    name: test (Python 3.10 lower bound)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # Preserve rustup and tools installed outside cargo install.
          cache-bin: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Build and install (Python 3.10)
        run: uv sync --all-extras --group interop --no-editable-package pylopdf --python 3.10
      - name: Test
        run: uv run --no-sync pytest
      - name: Type check against the installed Python 3.10 environment
        run: uv run --no-sync ty check
      - name: Record native Pyodide compatibility baseline
        run: |
          uv run --no-sync python tools/pyodide_compat.py \
            --root . \
            --output native-compat/results.json
          uv run --no-sync python tools/pyodide_compat.py \
            --root . \
            --benchmark-only \
            --benchmark-output native-compat/limits-benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-pyodide-compat-${{ github.sha }}
          path: native-compat/*.json
          retention-days: 7

  # Test the newest GIL-enabled CPython against the same abi3-py310 build.
  test-py315:
    name: test (Python 3.15)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # Preserve rustup and tools installed outside cargo install.
          cache-bin: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Build and install (Python 3.15)
        run: uv sync --all-extras --group interop --no-editable-package pylopdf --python 3.15
      - name: Test
        run: uv run --no-sync pytest

  # Test each version-specific ABI without silently falling back to the GIL.
  test-free-threaded:
    name: test (Python ${{ matrix.python }} free-threaded)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # Keep one cache per interpreter: PyO3 rebuilds for each version.
          key: ${{ matrix.python }}
          # Preserve rustup and tools installed outside cargo install.
          cache-bin: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install (Python ${{ matrix.python }})
        # Keep this lane focused on pylopdf: optional interop extensions may not
        # publish free-threaded wheels on the same schedule.
        run: uv sync --all-extras --no-editable-package pylopdf --python ${{ matrix.python }}
      - name: Verify free-threaded import
        run: >-
          uv run --no-sync python -c
          "import sys, sysconfig, pylopdf;
          assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1;
          assert not sys._is_gil_enabled()"
      - name: Test
        run: uv run --no-sync pytest

  test-pyemscripten:
    name: test (Pyodide 0.28.3)
    needs: test-py310
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      UV_PYTHON_DOWNLOADS: automatic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.2"
      - name: Download native compatibility baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-pyodide-compat-${{ github.sha }}
          path: native-compat
      - name: Restore pinned Pyodide build environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/pyodide-0.28.3
          key: >-
            pyodide-0.28.3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('tools/build_pyodide.sh',
            'tools/pyodide-build-requirements.txt',
            'rust/Cargo.lock') }}
          restore-keys: |
            pyodide-0.28.3-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and smoke-test PyEmscripten wheel
        run: bash tools/build_pyodide.sh
        env:
          PYLOPDF_PYODIDE_NATIVE_RESULTS: native-compat/results.json
          PYLOPDF_PYODIDE_BENCHMARK_OUTPUT: pyodide-compat/limits-benchmark.json
          PYLOPDF_PYODIDE_METRICS_OUTPUT: pyodide-compat/runtime-metrics.json
      - name: Record PyEmscripten artifact size
        run: >-
          python tools/wasm_artifact_metrics.py
          dist/pyodide-0.28.3/*.whl
          --output pyodide-compat/artifact-metrics.json
      - name: Bundle and launch Cloudflare Workers smoke
        run: >-
          python tools/smoke_cloudflare.py
          --wheel dist/pyodide-0.28.3/*.whl
          --metrics-output cloudflare-compat/bundle-metrics.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyemscripten-wheel-pyodide-0.28.3
          path: dist/pyodide-0.28.3/*.whl
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyodide-limit-benchmark-${{ github.sha }}
          path: pyodide-compat/limits-benchmark.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyodide-size-startup-${{ github.sha }}
          path: |
            pyodide-compat/artifact-metrics.json
            pyodide-compat/runtime-metrics.json
            cloudflare-compat/bundle-metrics.json
          retention-days: 7

  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # Preserve rustup and tools installed outside cargo install.
          cache-bin: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Rust format check
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Build and install
        # The interop group tests the ecosystem recipes documented in the README.
        run: uv sync --all-extras --group interop --no-editable-package pylopdf --python 3.14
      - name: Validate project metadata
        run: uv run --no-sync pre-commit run validate-pyproject --all-files
      - name: Python lint
        run: uv run --no-sync ruff check .
      - name: Repository language
        run: uv run --no-sync python tools/check_repository_language.py
      - name: Python format check
        run: uv run --no-sync ruff format --check .
      - name: Type check
        # ty checks the Python 3.10 floor from project.requires-python.
        run: uv run --no-sync ty check
      - name: Test
        run: uv run --no-sync pytest
