# Automated dependency update pull requests
version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    ignore:
      # HarfRust 0.12 exposes read-fonts 0.41 types; 0.42 is not type-compatible.
      - dependency-name: read-fonts
        versions: [">=0.42.0"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pyodide 0.28.3 requires this exact build frontend and output contract.
      - dependency-name: pyodide-build
        versions: [">0.30.7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
