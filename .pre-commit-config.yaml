# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# python/ and lambda_test/ are unrelated colocated work.
exclude: ^(python/|lambda_test/|openai_layer\.zip|rust/src/lopdf/)
repos:
  - repo: local
    hooks:
      - id: repository-language
        name: repository language
        entry: python -X utf8 tools/check_repository_language.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # Use the ref you want to point at
    hooks:
      - id: check-added-large-files
        # Versioned OCR/font data is intentionally packaged in separate wheels;
        # recorded hashes, CI verification, and release attestations cover it.
        exclude: ^(models/pylopdf-ocr-models/src/pylopdf_ocr_models/.*\.rten|fonts/pylopdf-fonts-[^/]+/src/[^/]+/.*\.(otf|ttf))$
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      # - id: check-docstring-first
      - id: check-executables-have-shebangs
      # - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      # - id: double-quote-string-fixer
      - id: end-of-file-fixer
      # - id: file-contents-sorter
      - id: fix-byte-order-marker
      # - id: fix-encoding-pragma
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: ^tests/assets/
      # - id: no-commit-to-branch
      - id: pretty-format-json
        # tools/check_parity.py owns the manifest's one-entry-per-line format,
        # and the parity manifest test checks it in CI.
        exclude: ^api/pymupdf-parity\.json$
      - id: requirements-txt-fixer
      - id: sort-simple-yaml
      - id: trailing-whitespace
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        # Read UTF-8 independently of the default Windows code page.
        entry: python -X utf8 -m validate_pyproject
        files: (^|/)pyproject\.toml$
        # trove-classifiers also validates that classifiers actually exist.
        # schema-store is excluded because it raises an internal error.
        additional_dependencies: ["packaging>=26.2", "trove-classifiers"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.1
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      # ty resolves imports from the synced project environment (uv sync), so
      # it checks against the same pytest and extras as CI. astral-sh's own
      # ty-pre-commit hook would run `uv check`, which syncs the project and
      # rebuilds the Rust extension.
      - id: ty
        name: ty
        entry: uv run --no-sync ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
